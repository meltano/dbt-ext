version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    labels: [deps]
    groups:
      development-dependencies:
        dependency-type: "development"
    allow:
      - dependency-type: "all"
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: quarterly
    labels: [deps]
    groups:
      ci:
        patterns:
          - "*"
    cooldown:
      default-days: 7
